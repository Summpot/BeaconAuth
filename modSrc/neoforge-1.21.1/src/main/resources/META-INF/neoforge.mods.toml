modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/Summpot/BeaconAuth/issues"
license = "MIT"

[[mods]]
modId = "beaconauth"
version = "${version}"
displayName = "Beacon Auth"
displayURL = "https://github.com/Summpot/BeaconAuth"
logoFile = "icon.png"
authors = "Summpot"
description = '''
Secure web, OAuth, and passkey authentication for Minecraft servers using a BeaconAuth auth server.
'''

[[mixins]]
config = "beaconauth.mixins.json"

[[dependencies.beaconauth]]
modId = "neoforge"
mandatory = true
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.beaconauth]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.beaconauth]]
modId = "architectury"
mandatory = true
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"
